name = "books"
version = "0.1.0"
defaultTargets = ["FastPower", "Metatheory", "TypeSoundness", "corpus-report", "validate-one"]

# Every proof in this repository. `../ruby-lean` holds the executable model
# (`RubyCore/`) and is used here as a library. A path dependency builds in `../ruby-lean/.lake`,
# so its build is shared.
#
#   Books/Lib/            machinery for proving things about one Ruby program
#   Books/FastPower/      a Ruby program proved correct
#   Books/Metatheory/     facts about the model itself
#   Books/TypeSoundness/  the type checker (Checker/) and its soundness theorem
#
# See README.md for what each book proves and where to start reading.
[[require]]
name = "rubylean"
path = "../ruby-lean"

# One library per book, each a whole directory, and `lake build` builds all of
# them: every file under `Books/` compiles. All libraries root at `Books`, so
# that an `import Books.…` resolves whichever library asked for it.

# A Ruby program proved correct, with the machinery it is written in.
[[lean_lib]]
name = "FastPower"
srcDir = "."
roots = ["Books"]
globs = ["Books.Lib.+", "Books.FastPower.+"]

# Facts about the model. `scripts/check-metatheory.sh` adds the axiom audit.
[[lean_lib]]
name = "Metatheory"
srcDir = "."
roots = ["Books"]
globs = ["Books.Metatheory.+"]

# The checker's soundness theorem, with its registry, controls and worked examples.
# `Books/TypeSoundness/Comparator/Challenge.lean` restates the theorems with `sorry`
# for a proof; `scripts/run-comparator.sh` has `leanprover/comparator` check the
# real ones against it.
[[lean_lib]]
name = "TypeSoundness"
srcDir = "."
roots = ["Books"]
globs = ["Books.TypeSoundness.+"]

# What `scripts/check-soundness.sh` prints: which typing rules have a soundness
# proof, and which corpus programs the real `validateD` accepts.
[[lean_exe]]
name = "corpus-report"
root = "Books.TypeSoundness.Report.Main"

# The type checker as an executable: reads one program and one derivation as
# JSON and prints `validateD`'s verdict. `bin/ruby-lean-check` and the
# playground use it. It links the checker and nothing of the model.
[[lean_exe]]
name = "validate-one"
root = "Books.TypeSoundness.Checker.Main"
