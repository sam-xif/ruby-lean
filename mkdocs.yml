site_name: ruby-lean
site_description: An executable semantics for Ruby in Lean 4, and a typed fragment whose checker is backed by a proof.
repo_url: https://github.com/sam-xif/ruby-lean
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences

nav:
  - Home: index.md
  - Reproducing the results: reproducing.md
  - The model:
      - Layout and fragment: model/fragment.md
      - Metatheory: model/metatheory.md
  - The front end:
      - The round-trip method (artifact 06): front-end/method.md
      - Growing the fragment: front-end/growing-the-fragment.md
      - Linearization: front-end/linearization.md
  - Differential testing:
      - Testing methodology (artifact 05): testing/methodology.md
      - The difftest engine: testing/engine.md
  - The playground: playground.md

validation:
  links:
    anchors: warn
