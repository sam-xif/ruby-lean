site_name: ruby-lean
site_description: An executable semantics of Ruby in Lean 4, tested against CRuby, with machine-checked proofs about Ruby programs.
repo_url: https://github.com/sam-xif/ruby-lean
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Run a program: guides/run-a-program.md
      - Prove a program type-safe: guides/prove-type-safety.md
      - Prove a program correct: guides/prove-a-program.md
      - The playground: playground.md
  - The semantics:
      - Overview and code map: semantics/index.md
      - 00 — Notation and abstract syntax: semantics/syntax.md
      - 01 — Objects, values and the heap: semantics/objects.md
      - 02 — Method dispatch: semantics/dispatch.md
      - 03 — Variables, scope and constants: semantics/variables.md
      - 04 — Blocks, procs and control flow: semantics/control-flow.md
      - Design decisions: semantics/design.md
      - Supported Ruby: semantics/supported-ruby.md
  - Proofs:
      - What is proved: proofs/index.md
      - Type soundness: proofs/type-soundness.md
      - Metatheory: proofs/metatheory.md
      - What you have to trust: proofs/trust.md
  - Testing: testing.md
  - Contributing: contributing.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
