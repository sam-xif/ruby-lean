# CI runs `make check`, split across five jobs so they run in parallel, and a
# sixth, `CI`, that passes only if all five did.
#
# Every job runs on every pull request and every push to main, and every step
# blocks: there is no report-only step and no path filter. Each step is a `make`
# target, so a local `make check` and a CI run mean the same thing.
#
#   proofs        the model builds; every proof book builds, the checker included; the
#                 axiom audits; the soundness check over the corpus; the comparator
#   conformance   the model against CRuby, and the differential tester's own tests
#   front-end     the desugarer against CRuby
#   lint          formatting and lint over the Python, the Ruby tooling, the shell scripts
#                 and the workflows
#   docs          the documentation site builds with no broken links
#   CI            the workflow's verdict: the one check the ruleset on main requires
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run on any branch: gh workflow run ci.yml --ref <branch>
  schedule:
    # Nightly, so that drift in something fetched from the network is noticed.
    - cron: "0 6 * * *"

# A newer push to a branch cancels the run in progress, except on main: every
# run on main finishes, so main always saves the build cache that pull requests
# start from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  # The CRuby release the model is checked against (also in mise.toml and the Makefile).
  RUBY_VERSION: "4.0.5"

jobs:
  proofs:
    name: proofs (build, every book, axioms, soundness, comparator)
    runs-on: ubuntu-latest
    timeout-minutes: 150 # a cold build of the books is about half an hour
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (toolchain pinned in ruby-lean/lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: ruby-lean
          use-github-cache: false # lean-action saves before anything is built

      # One cache holds both Lake build directories: the model's (ruby-lean/.lake)
      # and the books' (books/.lake, which includes the fetched comparator). The
      # key names the exact sources; any older build for the same toolchain is
      # restored when there is no exact match, and Lake rebuilds only what changed.
      - name: Restore the Lean build
        id: lake
        uses: actions/cache/restore@v4
        with: &lake-cache
          path: |
            ruby-lean/.lake
            books/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('ruby-lean/lean-toolchain') }}-${{ hashFiles('ruby-lean/**/*.lean', 'books/**/*.lean', 'ruby-lean/lakefile.toml', 'books/lakefile.toml', 'books/lake-manifest.json', 'books/**/run-comparator.sh', 'books/**/Comparator/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('ruby-lean/lean-toolchain') }}-

      - uses: astral-sh/setup-uv@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - run: make deps
      - run: make prereqs
      - run: make lean
      - run: make gen-check
      - run: make books
      - run: make metatheory
      - run: make soundness
      - run: make comparator

      # Saved whatever the outcome, so a failed or cancelled run keeps the
      # modules it did build. Only a passing run saves under the exact key; any
      # other saves under a key of its own, which later runs restore by prefix
      # but never mistake for a complete build.
      - name: Save the Lean build
        if: always() && steps.lake.outcome == 'success' && steps.lake.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ruby-lean/.lake
            books/.lake
          key: ${{ steps.lake.outputs.cache-primary-key }}${{ job.status != 'success' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}

  conformance:
    name: conformance (the model against CRuby)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (toolchain pinned in ruby-lean/lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: ruby-lean
          use-github-cache: false # lean-action saves before anything is built

      # The proofs job's cache, restored and never saved: this job builds only
      # the model. The paths must match the proofs job's for the cache to match.
      - name: Restore the Lean build
        uses: actions/cache/restore@v4
        with: *lake-cache

      - uses: astral-sh/setup-uv@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Cache the bootstraptest checkout
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruby-lean
          key: ruby-src-${{ hashFiles('Makefile') }}

      - run: make deps
      - run: make conformance
      - run: make feature-loading
      - run: make difftest-test
      - run: make book-checks

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: .make/conformance
          if-no-files-found: ignore

  front-end:
    name: front-end (the desugarer against CRuby)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Cache the bootstraptest checkout
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruby-lean
          key: ruby-src-${{ hashFiles('Makefile') }}

      - run: make deps
      - run: make desugar-test
      - run: make desugar-coverage

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
      - run: make deps
      - run: make lint

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make ci-sync
      - run: make docs

  # GitHub reports each job as a check under the job's name; the workflow itself
  # is never reported. This job is the workflow's verdict, under the name the
  # ruleset on `main` requires, so the ruleset does not have to list the jobs
  # above and cannot fall out of step with them. `if: always()` makes it report
  # when a job fails too, rather than being skipped, which would leave the
  # required check waiting.
  ci:
    name: CI
    needs: [proofs, conformance, front-end, lint, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [[ $r == success ]] || { echo "a job did not succeed: $r"; exit 1; }
          done
