# CI runs `make check`, split across four jobs so they run in parallel.
#
# Every job runs on every pull request and every push to main, and every step
# blocks: there is no report-only step and no path filter. Each step is a `make`
# target, so a local `make check` and a CI run mean the same thing.
#
#   proofs        the model and the checker build; every proof book builds; the
#                 axiom audits; the soundness check over the corpus; the comparator
#   conformance   the model against CRuby over MRI's bootstraptest
#   front-end     the desugarer against CRuby, and the differential tester's own tests
#   docs          the documentation site builds with no broken links
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run on any branch: gh workflow run ci.yml --ref <branch>
  schedule:
    # Nightly, so that drift in something fetched from the network is noticed.
    - cron: "0 6 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  # The CRuby release the model is checked against (also in mise.toml and the Makefile).
  RUBY_VERSION: "4.0.5"

jobs:
  proofs:
    name: proofs (build, every book, axioms, soundness, comparator)
    runs-on: ubuntu-latest
    timeout-minutes: 150 # a cold build of the books is about half an hour
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (toolchain pinned in ruby-lean/lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: ruby-lean
          use-github-cache: true

      # lean-action caches ruby-lean/.lake. The proofs build in books/.lake,
      # which is most of the compile time.
      - name: Cache the proof books' build
        uses: actions/cache@v4
        with:
          path: books/.lake
          key: ${{ runner.os }}-books-lake-${{ hashFiles('ruby-lean/lean-toolchain', 'ruby-lean/**/*.lean', 'books/**/*.lean', 'books/lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-books-lake-

      - uses: astral-sh/setup-uv@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - run: make deps
      - run: make prereqs
      - run: make gen-check
      - run: make lean
      - run: make books
      - run: make metatheory
      - run: make soundness
      - run: make comparator

  conformance:
    name: conformance (the model against CRuby)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (toolchain pinned in ruby-lean/lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: ruby-lean
          use-github-cache: true

      - uses: astral-sh/setup-uv@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Cache the bootstraptest checkout
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruby-lean
          key: ruby-src-${{ hashFiles('Makefile') }}

      - run: make deps
      - run: make conformance
      - run: make feature-loading

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: .make/conformance
          if-no-files-found: ignore

  front-end:
    name: front-end (desugarer and difftest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Cache the bootstraptest checkout
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruby-lean
          key: ruby-src-${{ hashFiles('Makefile') }}

      - run: make deps
      - run: make desugar-test
      - run: make desugar-coverage
      - run: make difftest-test

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make docs
