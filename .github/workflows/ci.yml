# CI for ruby-lean — issue #4 (Proposal rev 2).
#
# Proves on every pull request that every build passes AND that no ratchet
# regresses. The ratchets are the point: a change can build cleanly and still
# silently drop the model's CRuby agreement, the desugarer's fragment coverage,
# or the typed ladder's reach. Each is a checked-in high-watermark and a fall is
# red. See "Ratchet high-watermarks" in issue #4.
#
# Commands are the repo's own documented ones (AGENTS.md, docs/reproducing.md,
# README.md) — CI calls the scripts rather than re-implementing the sequence, so
# local and CI semantics cannot drift.
#
# Rollout note (issue #4): land report-only first, capture the watermarks, then
# flip the required jobs to blocking and add them to `main`'s branch protection.
# This file ships them blocking; the initial watermarks come from the documented
# v0.01 numbers (README.md) and the existing baseline/floor files.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly: the heavy, network-dependent model-vs-CRuby run.
    - cron: "0 6 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The repo anticipates a protected uv cache (docs/reproducing.md).
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  # ---------------------------------------------------------------------------
  # 0. Path detection. `paths:` cannot be combined with a `needs:`-gated job, so
  #    the expensive path-scoped jobs ask this one what changed instead.
  # ---------------------------------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      model: ${{ steps.filter.outputs.model }}
      playground: ${{ steps.filter.outputs.playground }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            model:
              - 'ruby-lean/**'
              - 'desugar/**'
              - 'difftest/**'
            playground:
              - 'playground/**'
              - 'ruby-lean/wasm/**'

  # ---------------------------------------------------------------------------
  # 1. The centerpiece: the repo's own gate. Blocks merge.
  # ---------------------------------------------------------------------------
  lean-gate:
    name: lean-gate (build + typed ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 60 # ~30 min cold build; warm cache is seconds-to-minutes
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (toolchain pinned in ruby-lean/lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: ruby-lean
          use-github-cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install CRuby (the differential oracle, 4.0.x)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install Sorbet
        run: gem install sorbet sorbet-runtime

      - name: Locate Sorbet
        run: |
          # srb_sigs.py and check-prereqs.sh both honor $SORBET; point it at the
          # gem's bundled binary wherever ruby/setup-ruby put it.
          SORBET_BIN="$(find "$(gem env gemdir)" -path '*sorbet-static-*/libexec/sorbet' -type f 2>/dev/null | head -1)"
          echo "SORBET=$SORBET_BIN" >> "$GITHUB_ENV"

      - name: Prerequisites
        run: scripts/check-prereqs.sh

      # The repo's own gate and the norm AGENTS.md states ("The gate must be green
      # before you commit"). It builds only the active certified registry and its
      # dependencies, then runs the corpus pipeline, agreement and reach checks.
      - name: Typed ratchet gate (the headline)
        run: make gate

      # Full `lake build` compiles every module on disk in all four libraries,
      # including the proof families the active `clinkProfile` has gated out
      # (`Denote/Clink/README.md`, "active semantic rebuild"). Those gated modules
      # are repaired rule-by-rule as rules are climbed, so a whole-library build is
      # red by construction between climbs. It is surfaced here -- so the rot stays
      # visible, per AGENTS.md "Proofs rot silently" -- but does not fail the gate.
      # Flip to blocking once the profile is complete and every module builds.
      - name: Full lake build (semantic rebuild in progress, report-only)
        continue-on-error: true
        run: make lean

      # Report-only for now: scripts/reproduce.sh documents this as KNOWN RED at
      # 0.01 (Step 5). Issue #4 Open question 1 asks whether to make it blocking;
      # until that is decided, a red metatheory is surfaced but does not fail the
      # gate. Flip to blocking (drop continue-on-error) once Preservation.lean is
      # fixed and the basline confirms it is green.
      - name: Metatheory + axioms (off-target proofs, report-only)
        continue-on-error: true
        run: cd ruby-lean && ./scripts/check-proofs.sh

      - name: Upload reach / gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-gate-artifacts
          path: |
            ruby-lean/build
            difftest/reports
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. The front end — no Lean needed, fast feedback on its own.
  # ---------------------------------------------------------------------------
  desugar:
    name: desugar (round-trip + coverage ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install CRuby (Prism)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Assert CRuby 4.0.x
        run: |
          ruby --version
          ruby -e 'v = RUBY_VERSION; abort "need 4.0.x, got #{v}" unless v.start_with?("4.0.")'

      - name: Cache the sparse ruby/ruby checkout and harvested corpus
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ruby-src
            desugar/corpus/bootstraptest
          key: ${{ runner.os }}-ruby-src-bootstraptest-v1

      - name: Harvest bootstraptest if missing
        run: |
          if [ ! -e desugar/corpus/bootstraptest ]; then
            RUBY_SRC=/tmp/ruby-src scripts/ci/harvest_bootstraptest.sh
          fi

      - name: Round-trip every corpus program against CRuby
        run: ruby desugar/bin/run

      - name: Coverage ratchet (in_fragment vs coverage-baseline.json)
        run: ruby desugar/bin/coverage

  # ---------------------------------------------------------------------------
  # 3. The differential-testing engine's own unit tests.
  # ---------------------------------------------------------------------------
  difftest:
    name: difftest (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install CRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Sync
        run: cd difftest && uv sync

      - name: pytest
        run: cd difftest && uv run pytest

  # ---------------------------------------------------------------------------
  # 4. Pipeline controls that depend on the Lean build + Sorbet.
  # ---------------------------------------------------------------------------
  pipeline-controls:
    name: pipeline-controls
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lean-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (toolchain pinned in ruby-lean/lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: ruby-lean
          use-github-cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install CRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install Sorbet
        run: gem install sorbet sorbet-runtime

      - name: Locate Sorbet
        run: |
          # srb_sigs.py and check-prereqs.sh both honor $SORBET; point it at the
          # gem's bundled binary wherever ruby/setup-ruby put it.
          SORBET_BIN="$(find "$(gem env gemdir)" -path '*sorbet-static-*/libexec/sorbet' -type f 2>/dev/null | head -1)"
          echo "SORBET=$SORBET_BIN" >> "$GITHUB_ENV"

      - name: Build (for the profile-independent controls)
        # `check-feature-loading.py` runs on `rubycore` alone. No whole-library
        # `lake build` here: it would compile the gated proof families the active
        # profile excludes and fail on the in-progress rebuild.
        run: cd ruby-lean && lake build --log-level=error rubycore

      # `scripts/check_body_inference.py` is deliberately NOT run here. It is a
      # FULL-profile control -- a stage of `scripts/run_full_typed_ratchet.sh`, which
      # runs it after `lake build ... Denote.Controls.All` and a full-profile
      # validate-one. It went green under the pre-rebuild complete profile (clink 244,
      # dfa51161), but `validate-one` now uses the gated `ClinkPolicy.clinkProfile`
      # (37/99 rules, 2026-09-30 "active semantic rebuild"). Its block/closure/
      # callSingleton cases are rejected by design, and its negative cases pass
      # vacuously because gated rules reject everything -- so running it here would be
      # a permanently red step that measures nothing. It stays a stage of the full
      # gate and is re-added here (blocking) once `clinkProfile` is `none`; individual
      # cases move into the active gate as their clinks are climbed.
      - name: Feature loading
        run: python3 ruby-lean/scripts/check-feature-loading.py

  # ---------------------------------------------------------------------------
  # 4b. The regression floor: compare live values to the checked-in watermarks.
  #     All three ratchets in one job, with one summary.
  # ---------------------------------------------------------------------------
  ratchets:
    name: ratchets (no regression)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: lean-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (toolchain pinned in ruby-lean/lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: ruby-lean
          use-github-cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install CRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install Sorbet
        run: gem install sorbet sorbet-runtime

      - name: Locate Sorbet
        run: |
          # srb_sigs.py and check-prereqs.sh both honor $SORBET; point it at the
          # gem's bundled binary wherever ruby/setup-ruby put it.
          SORBET_BIN="$(find "$(gem env gemdir)" -path '*sorbet-static-*/libexec/sorbet' -type f 2>/dev/null | head -1)"
          echo "SORBET=$SORBET_BIN" >> "$GITHUB_ENV"

      - name: Typed ratchet floors (fragmentFloor / clinkFloor / safeRungFloor + reach)
        run: cd ruby-lean && ./scripts/run_typed_ratchet.sh

      - name: Cache the sparse ruby/ruby checkout and harvested corpus
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ruby-src
            desugar/corpus/bootstraptest
          key: ${{ runner.os }}-ruby-src-bootstraptest-v1

      - name: Harvest bootstraptest if missing
        run: |
          if [ ! -e desugar/corpus/bootstraptest ]; then
            RUBY_SRC=/tmp/ruby-src scripts/ci/harvest_bootstraptest.sh
          fi

      - name: Desugarer bootstraptest ratchet (in_fragment)
        run: ruby desugar/bin/coverage

  # ---------------------------------------------------------------------------
  # 5. The semantics bootstraptest ratchet — the model vs CRuby over MRI's
  #    bootstraptest. Network (sparse clone of ruby/ruby) and heavy; runs when
  #    the model/front-end/difftest changed, and nightly.
  # ---------------------------------------------------------------------------
  diff-test-lean:
    name: difftest-lean (model vs CRuby + semantics watermark)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes, lean-gate]
    # On push/nightly it always runs; on a PR only when the model, the front end
    # or the engine changed.
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.model == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (toolchain pinned in ruby-lean/lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: ruby-lean
          use-github-cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install CRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Cache the sparse ruby/ruby checkout and harvested corpus
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ruby-src
            desugar/corpus/bootstraptest
          key: ${{ runner.os }}-ruby-src-bootstraptest-v1

      - name: Harvest bootstraptest if missing
        run: |
          if [ ! -e desugar/corpus/bootstraptest ]; then
            RUBY_SRC=/tmp/ruby-src scripts/ci/harvest_bootstraptest.sh
          fi

      # `--sut lean` shells out to ruby-lean/.lake/build/bin/rubycore, and jobs do
      # not share a filesystem (lean-gate's build is not visible here). Without
      # this the replay dies with FileNotFoundError, writes no summary.json and
      # the watermark step then exits 2 ("must contain summary.json"). Build only
      # the executables, via the repo's own Make target.
      - name: Build the model executable (rubycore)
        run: make lean-exes

      - name: Replay the model against CRuby (writes difftest/reports/<stamp>)
        id: replay
        run: |
          cd difftest
          uv sync --quiet
          set +e
          uv run python -m difftest run --tier 0 --sut lean --out ../.reports/bootstraptest
          rc=$?
          set -e
          # The engine's exit code catches `disagree`; the watermark below is the
          # new guard (agree / sut_unsupported), which has no other check.
          echo "replay_rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Semantics bootstraptest ratchet
        run: scripts/ci/check_semantics_watermark.sh .reports/bootstraptest

      - name: Upload semantics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantics-bootstraptest-report
          path: .reports/bootstraptest
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 6. Docs (strict: a broken cross-reference is a failure).
  # ---------------------------------------------------------------------------
  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the site (strict)
        run: uvx --from 'mkdocs<2' --with mkdocs-material mkdocs build --strict

  # ---------------------------------------------------------------------------
  # 7. Playground (optional): only when the playground or its wasm backend
  #    changed. The full static build is release-time, not per-PR.
  # ---------------------------------------------------------------------------
  playground:
    name: playground (native engine check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.playground == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: ruby-lean

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Note
        run: |
          echo "The wasm static build needs ruby-lean/wasm/build.sh and wasm/ruby/build.sh,"
          echo "which are release-time. This job is a placeholder to keep the surface"
          echo "visible; wire check.mjs here once the wasm build is CI-viable."
