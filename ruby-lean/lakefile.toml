name = "rubylean"
version = "0.1.0"
defaultTargets = ["Json", "RubyCore", "rubycore", "genprelude"]

# The model: an executable semantics of Ruby (`RubyCore/`), and the `rubycore`
# executable that runs it.
#
# Nothing here proves anything, and nothing here is a type checker. The proofs
# about the model, and the type checker with its soundness proof, are in
# `../books/`, a separate Lake package that uses this one as a library.

# ─────────────────────────────────────────────────────────────────────────────
# The vendored JSON library
# ─────────────────────────────────────────────────────────────────────────────

# `Json/` is Lean's own `Lean.Data.Json`, copied in at the root namespace. It is
# infrastructure, not model and not checker, so both may import it. See `Json.lean` for the
# measurement that forced it: `import Lean.Data.Json` links all of `libLean`,
# which is 97 of the 102 MB `rubycore` used to weigh.
[[lean_lib]]
name = "Json"
srcDir = "."
globs = ["Json", "Json.+"]

# ─────────────────────────────────────────────────────────────────────────────
# The model
# ─────────────────────────────────────────────────────────────────────────────

[[lean_lib]]
name = "RubyCore"

[[lean_exe]]
name = "rubycore"
root = "Main"

# Writes `RubyCore/Generated/Prelude.lean` (the prelude as Lean terms) from
# `RubyCore/Generated/PreludeJson.lean` (the prelude as exported JSON). Depends only on the
# decoder, never on `RubyCore.Prelude` itself, so it can always regenerate it.
[[lean_exe]]
name = "genprelude"
root = "GenPrelude"
