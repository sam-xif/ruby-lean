name = "ratchet"
version = "0.1.0"
defaultTargets = ["ratchet", "Semantics", "Denote"]

# `Ratchet/` (the certificate checker: `Expr`/`Ty` ported as copied text, `Cert`,
# `Validate`) is deliberately isolated from `../lean/`'s `rubycore` package: no
# import of anything under `../lean/RubyCore/`. See `AGENTS.md` for why.
#
# `Semantics/` is the one deliberate exception: the real semantics (`stepFn` and
# its ~24k-line dependency closure) is *imported*, not hand-copied, via the local
# path `require` below — see `Semantics/Interp.lean`'s module docstring for why
# that boundary is drawn where it is. `lake build`/`lake update` resolve this
# against `../lean`'s own package, reusing its already-built `.olean`s where
# possible; the transitive `plausible`/`iris` requires `../lean/lakefile.toml`
# declares are fetched into the manifest but never built, since nothing under
# `Semantics/` imports anything that needs them.

[[lean_lib]]
name = "Ratchet"
srcDir = "."
globs = ["Ratchet.+"]

[[lean_lib]]
name = "Semantics"
srcDir = "."
globs = ["Semantics.+"]

# `Denote/` — the *semantic* denotation of `Ratchet.Ty` (`Ty -> Heap -> Value -> Prop`,
# plus its computable `Bool` core). The one library that imports **both** `Ratchet/`'s
# copied type language and `Semantics/`'s real machine, on purpose: a denotation is by
# definition a statement relating the two. Maintained separately from the syntactic
# judgment (`Ratchet/Judge.lean`), which it does not import and which does not import it.
[[lean_lib]]
name = "Denote"
srcDir = "."
globs = ["Denote.+"]

# The semantic ratchet's report. Reads the `Judge` inductive's constructor list and the
# `Sem.*` discharges out of the environment at elaboration time (`Denote/Ladder.lean`), so the
# exe itself is a `println`. Separate from `ratchet` so each ladder's headline number stays a
# statement about exactly one thing -- reach vs. justification.
# `Denote/Examples.lean`'s report, printed. The `#guard`s there are the real gate (they fail
# the build); this is so the log shows *what* was checked.
[[lean_exe]]
name = "denotereport"
root = "DenoteReport"

[[lean_exe]]
name = "semladder"
root = "SemLadder"

[[lean_exe]]
name = "ratchet"
root = "Main"

# The typed ladder's runner: stage 5 of `scripts/build_corpus.py`'s pipeline, the only
# trusted one. See `MainTyped.lean`.
[[lean_exe]]
name = "ratchetd"
root = "MainTyped"

[[require]]
name = "rubycore"
path = "../lean"

# The evidence behind every climbed rung: pins each hand-authored `Judge` derivation
# (`Ratchet/Rungs.lean`) to the corpus syntax and to what the real semantics actually
# computes. Separate exe from `ratchet` so the ratchet's headline number stays a pure
# statement about `validate` -- see `CheckRungs.lean`'s docstring.
[[lean_exe]]
name = "checkrungs"
root = "CheckRungs"
