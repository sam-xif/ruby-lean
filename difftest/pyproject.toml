[project]
name = "difftest"
version = "0.1.0"
description = "Differential test engine for Ruby: CRuby control vs an arbitrary system-under-test"
requires-python = ">=3.12"
dependencies = [
    "hypothesis>=6.100",
    "anthropic>=0.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["difftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
